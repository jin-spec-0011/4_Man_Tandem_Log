name: unhide-reservations

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "복원 범위"
        type: choice
        options: [upcoming, all]
        default: upcoming
      dry_run:
        description: "목록만 확인 (쓰기 안 함)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mail-collect
  cancel-in-progress: false

jobs:
  unhide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Unhide
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          SCOPE: ${{ inputs.scope }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python collector/unhide.py
