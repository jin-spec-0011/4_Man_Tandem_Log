name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt

      - name: Install
        run: pip install -r collector/requirements-dev.txt

      - name: Python tests
        working-directory: collector
        run: python -m pytest -q tests

      - name: Python syntax (tools)
        run: python -m py_compile tools/gmail_oauth.py tools/verify_credentials.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: JS syntax
        run: |
          for f in app.js sw.js config.js; do node --check "$f"; done

      - name: JSON validity
        run: |
          for f in collector/rules.json database.rules.json manifest.webmanifest; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"
          done
