name: daily-mail-collect

on:
  schedule:
    - cron: "47 21 * * *"   # 매일 06:47 KST (UTC 21:47)
  workflow_dispatch:
    inputs:
      window_days:
        description: "수집 기간(일). 최초 백필은 60 권장, 평시 3"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: mail-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Check secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          missing=""
          [ -z "$ACCOUNTS_JSON" ] && missing="$missing ACCOUNTS_JSON"
          [ -z "$FIREBASE_DB_URL" ] && missing="$missing FIREBASE_DB_URL"
          [ -z "$FIREBASE_SA_JSON" ] && missing="$missing FIREBASE_SA_JSON"
          if [ -n "$missing" ]; then echo "::error::누락된 Secrets:$missing"; exit 1; fi

      - name: Collect
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '' }}
          PYTHONUNBUFFERED: "1"
        run: python collector/collect.py
