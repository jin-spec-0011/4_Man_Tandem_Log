<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qcells Tandem Ops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white; color: black; }
            .no-print, header, .grid-cols-4, #tab-daily, #tab-history, #tab-calendar, .print-hide { display: none !important; }
            #print-area { display: block !important; border: none !important; box-shadow: none !important; padding: 0 !important; width: 100% !important; }
            #preview-box { background: white !important; border: 1px solid #cbd5e1 !important; font-size: 14px !important; }
        }
        input[type="date"] { -webkit-appearance: none; appearance: none; background-color: #fff; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-12">

    <div class="max-w-xl mx-auto p-3 sm:p-6">
        <!-- 헤더 -->
        <header class="flex justify-between items-center mb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200/60">
            <div>
                <h1 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight">🏭 Tandem Ops</h1>
                <p class="text-xs text-slate-500 mt-0.5">리더: 김진세 | 4인 체제 (오토 6 / 메인 4)</p>
            </div>
            <div class="text-center bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold text-[11px] px-2.5 py-1 rounded-full whitespace-nowrap">
                Firebase Online
            </div>
        </header>

        <!-- 탭 메뉴 -->
        <div class="grid grid-cols-4 gap-1.5 mb-4 no-print text-center">
            <button onclick="switchTab('daily')" id="btn-daily" class="py-2.5 rounded-xl font-bold text-xs bg-blue-600 text-white shadow-sm transition">입력</button>
            <button onclick="switchTab('calendar')" id="btn-calendar" class="py-2.5 rounded-xl font-bold text-xs bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">캘린더</button>
            <button onclick="switchTab('history')" id="btn-history" class="py-2.5 rounded-xl font-bold text-xs bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">이슈조회</button>
            <button onclick="switchTab('export')" id="btn-export" class="py-2.5 rounded-xl font-bold text-xs bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">공유</button>
        </div>

        <!-- [PART 1] 일일 입력 섹션 -->
        <section id="tab-daily" class="space-y-4 no-print">
            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/60 space-y-4">
                <h2 class="font-bold text-sm sm:text-base text-slate-800 flex items-center gap-2">📅 날짜 및 교대 확인</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">날짜 선택</label>
                        <input type="date" id="log-date" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs sm:text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col justify-center">
                        <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wider mb-1">근무 형태 자동 표기</div>
                        <div id="shift-type-display" class="font-black text-blue-600 text-xs sm:text-sm">-</div>
                        <div id="work-hours-display" class="text-[11px] text-slate-500 mt-0.5 font-semibold">-</div>
                    </div>
                </div>

                <!-- 팀원 근태 사유 선택 (기타 수기입력 포함) -->
                <div class="space-y-3">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">팀원 근태 사유 선택</label>
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        
                        <!-- 김장환 -->
                        <div class="space-y-1">
                            <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                                <span>김장환 (T-04)</span>
                                <select id="leave-김장환" onchange="onLeaveChange('김장환')" class="p-1.5 border rounded-lg text-xs bg-white">
                                    <option value="정상근무">정상근무</option>
                                    <option value="연차">연차</option>
                                    <option value="휴가">휴가</option>
                                    <option value="교육">교육</option>
                                    <option value="병가">병가</option>
                                    <option value="훈련">훈련</option>
                                    <option value="반차">반차</option>
                                    <option value="반반차">반반차</option>
                                    <option value="육아">육아</option>
                                    <option value="기타">기타 (직접입력)</option>
                                </select>
                            </div>
                            <input type="text" id="custom-leave-김장환" placeholder="김장환 근태 사유 직접입력" class="hidden w-full p-1.5 border rounded-lg text-xs bg-white">
                        </div>

                        <!-- 권의환 -->
                        <div class="space-y-1">
                            <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                                <span>권의환 (T-1)</span>
                                <select id="leave-권의환" onchange="onLeaveChange('권의환')" class="p-1.5 border rounded-lg text-xs bg-white">
                                    <option value="정상근무">정상근무</option>
                                    <option value="연차">연차</option>
                                    <option value="휴가">휴가</option>
                                    <option value="교육">교육</option>
                                    <option value="병가">병가</option>
                                    <option value="훈련">훈련</option>
                                    <option value="반차">반차</option>
                                    <option value="반반차">반반차</option>
                                    <option value="육아">육아</option>
                                    <option value="기타">기타 (직접입력)</option>
                                </select>
                            </div>
                            <input type="text" id="custom-leave-권의환" placeholder="권의환 근태 사유 직접입력" class="hidden w-full p-1.5 border rounded-lg text-xs bg-white">
                        </div>

                        <!-- 김현진 -->
                        <div class="space-y-1">
                            <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                                <span>김현진 (T-04)</span>
                                <select id="leave-김현진" onchange="onLeaveChange('김현진')" class="p-1.5 border rounded-lg text-xs bg-white">
                                    <option value="정상근무">정상근무</option>
                                    <option value="연차">연차</option>
                                    <option value="휴가">휴가</option>
                                    <option value="교육">교육</option>
                                    <option value="병가">병가</option>
                                    <option value="훈련">훈련</option>
                                    <option value="반차">반차</option>
                                    <option value="반반차">반반차</option>
                                    <option value="육아">육아</option>
                                    <option value="기타">기타 (직접입력)</option>
                                </select>
                            </div>
                            <input type="text" id="custom-leave-김현진" placeholder="김현진 근태 사유 직접입력" class="hidden w-full p-1.5 border rounded-lg text-xs bg-white">
                        </div>

                    </div>
                </div>

                <!-- 공정 및 장비 이슈 -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">장비 및 공정 이슈 (오토 6 / 메인 4)</label>
                    <textarea id="issue-text" rows="4" class="w-full p-3 border border-slate-200 rounded-xl text-xs sm:text-sm focus:ring-2 focus:ring-blue-500 outline-none leading-relaxed" placeholder="[T-3 김진세] 특이사항...&#10;[T-04] 장비 에러 및 조치...&#10;[T-1 권의환] 특이사항..."></textarea>
                </div>

                <!-- 행정 완료 체크 -->
                <div class="flex gap-6 pt-1">
                    <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
                        <input type="checkbox" id="check-sheet" class="rounded text-blue-600 w-4 h-4"> 일일 실적마감
                    </label>
                    <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
                        <input type="checkbox" id="check-stock" class="rounded text-blue-600 w-4 h-4"> 셀 재고 관리
                    </label>
                </div>

                <button onclick="saveLogToFirebase()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-xs sm:text-sm shadow-md hover:bg-blue-700 transition">데이터 저장 및 반영</button>
            </div>
        </section>

        <!-- [PART 2] 캘린더 뷰 섹션 -->
        <section id="tab-calendar" class="hidden space-y-4">
            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/60 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 id="cal-month-title" class="font-bold text-sm sm:text-base text-slate-800">2026년 9월</h2>
                    <div class="flex gap-1">
                        <button onclick="changeMonth(-1)" class="px-3 py-1 bg-slate-100 rounded-lg text-xs font-bold">◀</button>
                        <button onclick="changeMonth(1)" class="px-3 py-1 bg-slate-100 rounded-lg text-xs font-bold">▶</button>
                    </div>
                </div>
                <!-- 달력 Grid -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 pb-1 border-b">
                    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center">
                    <!-- 동적 생성 -->
                </div>
            </div>
        </section>

        <!-- [PART 3] 이슈 조회 섹션 -->
        <section id="tab-history" class="hidden space-y-4">
            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/60 space-y-3">
                <h2 class="font-bold text-sm sm:text-base text-slate-800">🔍 장비 및 공정 이슈 조회</h2>
                <div id="history-container" class="space-y-3">
                    <div class="p-4 text-center text-xs text-slate-400">데이터를 불러오는 중...</div>
                </div>
            </div>
        </section>

        <!-- [PART 4] 공유 및 출력 섹션 -->
        <section id="tab-export" class="hidden space-y-4">
            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/60 space-y-3 no-print">
                <h2 class="font-bold text-sm sm:text-base text-slate-800">📤 외부 공유 및 리포트 추출</h2>
                <div class="space-y-2.5">
                    <button onclick="copyKakaoText()" class="w-full p-3.5 bg-amber-400 text-slate-900 font-bold text-xs sm:text-sm rounded-xl hover:bg-amber-500 transition flex items-center justify-center gap-2">
                        💬 카카오톡 전달용 텍스트 복사
                    </button>
                    <button onclick="exportExcel()" class="w-full p-3.5 bg-emerald-600 text-white font-bold text-xs sm:text-sm rounded-xl hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                        📊 엑셀(CSV) 파일 다운로드
                    </button>
                    <button onclick="window.print()" class="w-full p-3.5 bg-slate-800 text-white font-bold text-xs sm:text-sm rounded-xl hover:bg-slate-900 transition flex items-center justify-center gap-2">
                        🖨️ A4 프린트 (미리보기만 출력)
                    </button>
                </div>
            </div>

            <!-- 프린트 대상 영역 (실시간 요약 미리보기) -->
            <div id="print-area" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60 space-y-2">
                <h3 class="font-bold text-xs sm:text-sm text-slate-700 border-b pb-2">📋 실시간 요약 미리보기</h3>
                <div id="preview-box" class="text-[11px] sm:text-xs text-slate-600 space-y-1 font-mono bg-slate-50 p-3.5 rounded-xl whitespace-pre-wrap leading-relaxed">
                    데이터를 입력해주세요.
                </div>
            </div>
        </section>
    </div>

    <!-- Firebase SDK 및 로직 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2LBZMHgslX41qmbjZ0jKh1KJT-iKz5bY",
            authDomain: "qcells-tandem-ops.firebaseapp.com",
            projectId: "qcells-tandem-ops",
            storageBucket: "qcells-tandem-ops.firebasestorage.app",
            messagingSenderId: "909705800417",
            appId: "1:909705800417:web:1d20fff5bb8a566ce0e5a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.tandemDb = { db, collection, doc, setDoc, getDocs };
    </script>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('log-date').value = todayStr;
        let currentCalDate = new Date();
        let cachedLogs = {};

        window.addEventListener('DOMContentLoaded', () => {
            fetchAllLogs();
        });

        async function fetchAllLogs() {
            if(!window.tandemDb) return;
            try {
                const { db, collection, getDocs } = window.tandemDb;
                const querySnapshot = await getDocs(collection(db, "daily_logs"));
                cachedLogs = {};
                querySnapshot.forEach((doc) => {
                    cachedLogs[doc.id] = doc.data();
                });
            } catch (e) {
                console.error("데이터 로드 실패:", e);
            }
        }

        function switchTab(tabName) {
            ['daily', 'calendar', 'history', 'export'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).className = "py-2.5 rounded-xl font-bold text-xs bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition";
            });
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-' + tabName).className = "py-2.5 rounded-xl font-bold text-xs bg-blue-600 text-white shadow-sm transition";

            if(tabName === 'export') updatePreview();
            if(tabName === 'history') loadHistory();
            if(tabName === 'calendar') renderCalendar();
        }

        function calculateAutoShift(selectedDateStr) {
            const anchorDate = new Date('2026-09-07');
            const currentDate = new Date(selectedDateStr);
            const diffTime = currentDate.getTime() - anchorDate.getTime();
            const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
            const isNightShift = (((diffWeeks % 2) + 2) % 2) === 1;
            const dayOfWeek = currentDate.getDay();

            if (dayOfWeek === 0 || dayOfWeek === 6) return { shiftType: "휴무 (주말)", workHours: "휴무" };
            if (isNightShift) return { shiftType: "야간조", workHours: "20:00 ~ 08:00" };
            return { shiftType: "주간조", workHours: dayOfWeek === 5 ? "08:00 ~ 17:00 (단축)" : "08:00 ~ 20:00" };
        }

        function updateShiftDisplay() {
            const dateStr = document.getElementById('log-date').value;
            const res = calculateAutoShift(dateStr);
            document.getElementById('shift-type-display').innerText = res.shiftType;
            document.getElementById('work-hours-display').innerText = res.workHours;
        }

        document.getElementById('log-date').addEventListener('change', updateShiftDisplay);
        updateShiftDisplay();

        function onLeaveChange(name) {
            const selectVal = document.getElementById(`leave-${name}`).value;
            const customInput = document.getElementById(`custom-leave-${name}`);
            if(selectVal === '기타') {
                customInput.classList.remove('hidden');
            } else {
                customInput.classList.add('hidden');
            }
        }

        function getLogData() {
            const date = document.getElementById('log-date').value;
            const shift = calculateAutoShift(date);

            const getLeaveValue = (name) => {
                const val = document.getElementById(`leave-${name}`).value;
                if(val === '기타') {
                    return document.getElementById(`custom-leave-${name}`).value || '기타';
                }
                return val;
            };

            const leaves = {
                "김장환": getLeaveValue("김장환"),
                "권의환": getLeaveValue("권의환"),
                "김현진": getLeaveValue("김현진")
            };
            const issues = document.getElementById('issue-text').value;
            const sheet = document.getElementById('check-sheet').checked ? '완료' : '미완료';
            const stock = document.getElementById('check-stock').checked ? '완료' : '미완료';

            return { date, shift, leaves, issues, sheet, stock };
        }

        async function saveLogToFirebase() {
            const data = getLogData();
            if(!window.tandemDb) {
                alert('Firebase 연결 중입니다. 잠시 후 다시 시도해주세요.');
                return;
            }
            try {
                const { db, doc, setDoc } = window.tandemDb;
                await setDoc(doc(db, "daily_logs", data.date), data);
                cachedLogs[data.date] = data;
                alert('Firebase 클라우드에 성공적으로 저장되었습니다!');
                switchTab('export');
            } catch (e) {
                console.error("저장 오류:", e);
                alert('저장 중 오류가 발생했습니다.');
            }
        }

        async function loadHistory() {
            await fetchAllLogs();
            const container = document.getElementById('history-container');
            const dates = Object.keys(cachedLogs).sort().reverse();

            if(dates.length === 0) {
                container.innerHTML = '<div class="p-4 text-center text-xs text-slate-400 bg-slate-50 rounded-xl">저장된 기록이 없습니다.</div>';
                return;
            }

            container.innerHTML = dates.map(date => {
                const log = cachedLogs[date];
                return `
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5">
                        <div class="flex justify-between items-center text-xs font-bold text-blue-600 border-b pb-1">
                            <span>📅 ${date} (${log.shift.shiftType})</span>
                        </div>
                        <p class="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">${log.issues || '이슈 내용 없음'}</p>
                    </div>
                `;
            }).join('');
        }

        async function renderCalendar() {
            await fetchAllLogs();
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            document.getElementById('cal-month-title').innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            let gridHtml = '';
            for(let i=0; i<firstDay; i++) {
                gridHtml += `<div></div>`;
            }

            for(let d=1; d<=lastDate; d++) {
                const mm = String(month + 1).padStart(2, '0');
                const dd = String(d).padStart(2, '0');
                const dateStr = `${year}-${mm}-${dd}`;
                const log = cachedLogs[dateStr];

                let badge = '';
                if(log) {
                    badge = `<div class="w-1.5 h-1.5 bg-blue-600 rounded-full mx-auto mt-1"></div>`;
                }

                gridHtml += `
                    <div onclick="alert('${dateStr} 일지 확인\\n${log ? (log.issues ? log.issues.substring(0,30) + '...' : '이슈 없음') : '작성된 일지 없음'}')" 
                         class="p-2 border rounded-xl cursor-pointer hover:bg-blue-50 transition flex flex-col justify-between h-14 ${log ? 'bg-slate-50 border-blue-200' : 'border-slate-100'}">
                        <span class="text-xs font-bold text-slate-700">${d}</span>
                        ${badge}
                    </div>
                `;
            }
            document.getElementById('calendar-grid').innerHTML = gridHtml;
        }

        function changeMonth(diff) {
            currentCalDate.setMonth(currentCalDate.getMonth() + diff);
            renderCalendar();
        }

        function updatePreview() {
            const data = getLogData();
            let leaveStr = Object.entries(data.leaves).filter(([k,v]) => v !== '정상근무').map(([k,v]) => `${k}(${v})`).join(', ') || '없음';
            
            const text = `[현장 일일 보고] (${data.date})
- 근무형태: ${data.shift.shiftType} (${data.shift.workHours})
- 근태사유: ${leaveStr}
- 행정상태: 실적마감(${data.sheet}) / 재고관리(${data.stock})
- 장비 및 공정 이슈:
${data.issues || '특이사항 없음'}`;

            document.getElementById('preview-box').innerText = text;
        }

        function copyKakaoText() {
            navigator.clipboard.writeText(document.getElementById('preview-box').innerText).then(() => alert('복사되었습니다!'));
        }

        function exportExcel() {
            const data = getLogData();
            let leaveStr = Object.entries(data.leaves).map(([k,v]) => `${k}:${v}`).join('/');
            const csvContent = "\uFEFF" + "날짜,근무조,근태사유,실적마감,재고관리,이슈내용\n" +
                `"${data.date}","${data.shift.shiftType}","${leaveStr}","${data.sheet}","${data.stock}","${data.issues.replace(/\n/g, ' ')}"`;
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `현장보고_${data.date}.csv`;
            a.click();
        }
    </script>
