<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mail Ops">
  <title>Mail Ops</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="runDot" title="수집 상태"></span>
      <div>
        <h1>Mail Ops</h1>
        <p class="sub" id="runInfo">-</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="icon-btn" id="runNow" target="_blank" rel="noopener" title="지금 수집 (GitHub Actions)">↻</a>
      <button class="icon-btn" id="logoutBtn" title="로그아웃" hidden>⎋</button>
    </div>
  </header>

  <main id="view">
    <!-- 로그인 -->
    <section id="loginView" class="panel center" hidden>
      <h2>로그인</h2>
      <p class="muted">본인 계정만 데이터에 접근할 수 있습니다.</p>
      <button class="btn primary wide" id="googleLogin">Google로 로그인</button>
      <div class="divider"><span>또는 이메일</span></div>
      <form id="emailLogin" class="stack">
        <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username" required>
        <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password" minlength="6" required>
        <button class="btn wide" type="submit">이메일로 로그인</button>
      </form>
      <p class="err" id="loginErr"></p>
    </section>

    <!-- 권한 없음 -->
    <section id="deniedView" class="panel center" hidden>
      <h2>접근 권한 없음</h2>
      <p class="muted">database.rules.json 의 UID를 아래 값으로 교체 후 규칙을 배포하세요.</p>
      <code class="uid" id="myUid"></code>
      <button class="btn wide" id="copyUid">UID 복사</button>
    </section>

    <!-- 오늘 -->
    <section id="tab-today" class="tab" hidden>
      <div class="navrow">
        <button class="icon-btn" data-day="-1" aria-label="이전 날">‹</button>
        <input type="date" id="dayPick">
        <button class="icon-btn" data-day="1" aria-label="다음 날">›</button>
      </div>
      <div class="kpis" id="dayKpis"></div>
      <h3 class="h">계정별</h3>
      <div class="acc-grid" id="dayAccounts"></div>
      <h3 class="h">미열람 주요 메일 <span class="muted small">광고 제외</span></h3>
      <ul class="list" id="dayImportant"></ul>
      <h3 class="h">다가오는 예약 <span class="muted small">7일</span></h3>
      <ul class="list" id="dayUpcoming"></ul>
      <h3 class="h">14일 추이 <span class="legend"><i class="sw sw-a"></i>일반 <i class="sw sw-b"></i>광고</span></h3>
      <div class="trend" id="dayTrend"></div>
    </section>

    <!-- 지출 -->
    <section id="tab-spend" class="tab" hidden>
      <div class="navrow">
        <button class="icon-btn" data-month="-1" aria-label="이전 달">‹</button>
        <input type="month" id="monthPick">
        <button class="icon-btn" data-month="1" aria-label="다음 달">›</button>
      </div>
      <div class="kpis" id="spendKpis"></div>
      <h3 class="h">항목별</h3>
      <div class="bars" id="spendCats"></div>
      <h3 class="h">상세 <span class="muted small">항목 탭하여 분류 수정 · 중복은 제외 처리</span></h3>
      <div id="spendList"></div>
    </section>

    <!-- 예약 -->
    <section id="tab-res" class="tab" hidden>
      <div class="seg" id="resFilter">
        <button data-f="upcoming" class="on">예정</button>
        <button data-f="past">지난</button>
        <button data-f="all">전체</button>
      </div>
      <div id="resList"></div>
    </section>

    <!-- 차단 -->
    <section id="tab-block" class="tab" hidden>
      <p class="muted small rule" id="blockRule"></p>
      <div class="row-between">
        <h3 class="h">차단 요청 <span class="count" id="blockCount">0</span></h3>
        <button class="btn small" id="approveAll" hidden>전체 승인</button>
      </div>
      <div id="blockPending"></div>
      <h3 class="h">처리 완료</h3>
      <div id="blockDone"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="today" class="on"><span>◉</span>오늘</button>
    <button data-tab="spend"><span>₩</span>지출</button>
    <button data-tab="res"><span>▦</span>예약</button>
    <button data-tab="block"><span>⊘</span>차단<b class="badge" id="blockBadge" hidden></b></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="catDialog">
    <form method="dialog" class="stack">
      <h3 id="catTitle">분류 변경</h3>
      <select id="catSelect"></select>
      <label class="check"><input type="checkbox" id="catExclude"> 합계에서 제외 (중복·이체 등)</label>
      <div class="row-end">
        <button class="btn" value="cancel">취소</button>
        <button class="btn primary" value="ok" id="catSave">저장</button>
      </div>
    </form>
  </dialog>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
